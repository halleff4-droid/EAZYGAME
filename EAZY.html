<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#070d1c;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}
.screen{width:min(100%,460px);min-height:600px;background:linear-gradient(145deg,#101b36,#050a14);border:1px solid #1b2b4d;border-radius:24px;padding:28px 20px;box-shadow:0 18px 60px #0008}
h1{text-align:center;font-size:34px;margin:35px 0 12px;letter-spacing:1px}
.green{color:#10e58b}
.sub{text-align:center;color:#a8b5ce;margin-bottom:48px}
input,button{width:100%;border:0;border-radius:18px;padding:17px;font-size:18px}
input{background:#14213b;border:1px solid #30446d;color:white;margin-bottom:18px;outline:none}
button{background:linear-gradient(90deg,#08d987,#16c56e);color:white;font-weight:bold;cursor:pointer}
.error{color:#ff5268;text-align:center;min-height:22px;margin-top:12px}
#gameScreen{display:none}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:#dce7ff;font-weight:bold}
canvas{width:100%;aspect-ratio:1;background:#07111d;border:2px solid #263d63;border-radius:14px;display:block;touch-action:none}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:16px auto 0}
.controls button{padding:13px 0;border-radius:12px;background:#1b2d4d;font-size:22px}
.controls .empty{visibility:hidden}
.overlay{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}
.dialog{width:min(100%,420px);background:#08101d;border:3px solid #ff3453;border-radius:24px;padding:28px 20px;text-align:center;box-shadow:0 0 35px #ff244455}
.dialog h2{font-size:38px;color:#ff3453;margin:8px 0 20px}
.dialog p{font-size:25px;font-weight:bold;line-height:1.5;margin:10px 0 24px}
.dialog button{background:#ff294a}
.hint{text-align:center;color:#8999b7;font-size:13px;margin-top:14px}
</style>
</head>
<body>
<section class="screen" id="loginScreen">
  <h1><span class="green">SNAKE</span> GAME</h1>
  <p class="sub">اكتب كلمة السر باش تبدأ اللعب</p>
  <form id="loginForm">
    <input id="password" type="password" placeholder="Mot de passe" autocomplete="off" inputmode="numeric" required aria-label="Mot de passe">
    <button type="submit">دخول / Login</button>
    <div class="error" id="loginError"></div>
  </form>
</section>

<section class="screen" id="gameScreen">
  <div class="hud"><span>SNAKE GAME</span><span>Score: <b id="score">0</b></span></div>
  <canvas id="board" width="360" height="360" aria-label="لعبة الدودة"></canvas>
  <div class="controls">
    <span class="empty"></span><button data-dir="up" aria-label="فوق">▲</button><span class="empty"></span>
    <button data-dir="left" aria-label="يسار">◀</button><button data-dir="down" aria-label="تحت">▼</button><button data-dir="right" aria-label="يمين">▶</button>
  </div>
  <p class="hint">استعمل الأسهم في الكلافيي أو الأزرار. على الهاتف اسحب فوق اللعبة.</p>
</section>

<div class="overlay" id="gameOver">
  <div class="dialog">
    <h2>GAME OVER</h2>
    <p>براڤو، لقد خسرت!<br><span style="color:#ff3453">bara a9raaa t3di 8dwa</span></p>
    <button id="restart">إعادة اللعب</button>
  </div>
</div>
<script>
const loginScreen=document.getElementById('loginScreen'), gameScreen=document.getElementById('gameScreen');
const loginError=document.getElementById('loginError'), pass=document.getElementById('password');
document.getElementById('loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  if(pass.value!=='0000'){loginError.textContent='Mot de passe incorrect';return;}
  loginScreen.style.display='none';gameScreen.style.display='block';startGame();
});
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
const size=18, cells=20;
let snake,food,dir,nextDir,score,timer,running;
function randomFood(){let p;do{p={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function startGame(){
  clearInterval(timer);document.getElementById('gameOver').style.display='none';
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;running=true;document.getElementById('score').textContent=score;food=randomFood();draw();
  timer=setInterval(tick,125);
}
function tick(){
  if(!running)return;dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some((s,i)=>i>0&&s.x===head.x&&s.y===head.y)){endGame();return}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score++;document.getElementById('score').textContent=score;food=randomFood()}
  else snake.pop();draw();
}
function draw(){
  ctx.fillStyle='#07111d';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#13243a';ctx.lineWidth=1;
  for(let i=0;i<=cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(canvas.width,i*size);ctx.stroke()}
  ctx.fillStyle='#ff304f';ctx.beginPath();ctx.arc(food.x*size+size/2,food.y*size+size/2,size*.38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#11e46f';snake.forEach((s,i)=>{ctx.beginPath();ctx.arc(s.x*size+size/2,s.y*size+size/2,size*.42,0,Math.PI*2);ctx.fill();if(i===0){ctx.fillStyle='#07111d';ctx.beginPath();ctx.arc(s.x*size+6,s.y*size+6,2,0,7);ctx.arc(s.x*size+12,s.y*size+6,2,0,7);ctx.fill();ctx.fillStyle='#11e46f'}});
}
function endGame(){running=false;clearInterval(timer);document.getElementById('gameOver').style.display='flex'}
function change(d){if(!running)return;const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const n=map[d];if(n.x!==-dir.x||n.y!==-dir.y)nextDir=n}
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>change(b.dataset.dir)));
document.addEventListener('keydown',e=>{const m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(m[e.key]){e.preventDefault();change(m[e.key])}});
let touchX=0,touchY=0;
canvas.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});
canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.max(Math.abs(dx),Math.abs(dy))>18)change(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});
document.getElementById('restart').addEventListener('click',startGame);
</script>
</body>
</html>
